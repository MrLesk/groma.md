name: Release

# Publishing a GitHub release creates its tag and starts this workflow; the tag names the version.
on:
  workflow_dispatch:
    inputs:
      publish_scanners:
        description: Publish changed scanner packages without releasing Groma
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

env:
  NODE_OPTIONS: --use-openssl-ca
  BUN_VERSION: 1.4.3
  NODE_VERSION: 26.12.1

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-24.04
    steps:
      - &prepare-trust
        name: Block compromised certificate authorities before network steps
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), tls = require('node:tls');
          const { X509Certificate, createHash } = require('node:crypto');
          // CVE-2026-111943: protect action network calls; runner archive downloads happen earlier.
          const blocked = new Set([
            '0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282',
            '43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b',
            '49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f',
            '5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0',
            '63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8',
            '8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782',
            '92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30',
            'bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3',
            'c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9',
            'e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41',
            'ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105',
            'ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6',
          ]);
          const certificates = new Map();
          for (const pem of [...tls.rootCertificates, ...tls.getCACertificates('default'), ...tls.getCACertificates('system'), ...tls.getCACertificates('extra')]) {
            const certificate = new X509Certificate(pem);
            const key = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            if (!blocked.has(key)) certificates.set(certificate.fingerprint256, pem);
          }
          if (!certificates.size) throw new Error('No trusted certificate authorities remain.');
          const directory = path.join(process.env.RUNNER_TEMP, 'groma-tls');
          const bundle = path.join(directory, 'ca.pem'), empty = path.join(directory, 'empty');
          fs.mkdirSync(empty, { recursive: true });
          fs.writeFileSync(bundle, [...certificates.values()].join('\n') + '\n');
          const gitSettings = Number(process.env.GIT_CONFIG_COUNT ?? 0);
          if (!Number.isSafeInteger(gitSettings) || gitSettings < 0) throw new Error('Invalid GIT_CONFIG_COUNT.');
          const settings = {
            SSL_CERT_FILE: bundle, SSL_CERT_DIR: empty,
            NODE_EXTRA_CA_CERTS: bundle, NODE_USE_SYSTEM_CA: '0', NODE_TLS_REJECT_UNAUTHORIZED: '1',
            GIT_SSL_CAINFO: bundle, GIT_SSL_CAPATH: empty, CURL_CA_BUNDLE: bundle,
            GIT_CONFIG_COUNT: String(gitSettings + 2),
            [`GIT_CONFIG_KEY_${gitSettings}`]: 'http.schannelUseSSLCAInfo', [`GIT_CONFIG_VALUE_${gitSettings}`]: 'true',
            [`GIT_CONFIG_KEY_${gitSettings + 1}`]: 'http.sslVerify', [`GIT_CONFIG_VALUE_${gitSettings + 1}`]: 'true',
            CARGO_HTTP_CAINFO: bundle, NPM_CONFIG_CAFILE: bundle,
          };
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(settings).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare native HTTPS trust on disposable hosted runners
        run: node scripts/prepare-hosted-runner-trust.cjs
        shell: bash
      - parallel:
          - uses: ./.github/actions/setup-swift
          - uses: dart-lang/setup-dart@v1.8.1
            with:
              sdk: '3.13.6'
              # Swift's Windows setup exports its own action path; Dart analysis still runs below.
              problem-matcher: false
          - uses: actions/setup-java@v6.1.0
            with:
              distribution: temurin
              java-version: '27'
          - uses: actions/setup-dotnet@v6.0.0
            with:
              dotnet-version: '10.0.402'
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: ${{ env.BUN_VERSION }}
      - name: Check native HTTPS trust
        run: node scripts/check-native-tls.cjs
        shell: bash
      - name: Set version from tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - name: Install all Bun target dependencies
        run: bun install --frozen-lockfile --cafile="$SSL_CERT_FILE" --os="*" --cpu="*"
      - name: Run repository checks
        run: bun run check

  build-scanners:
    name: build-scanners-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-latest
            platform: win32-x64
          - runner: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare native HTTPS trust on disposable hosted runners
        run: node scripts/prepare-hosted-runner-trust.cjs
        shell: bash
      - parallel:
          - name: Cache SwiftSyntax build
            if: runner.os == 'Windows'
            uses: actions/cache@v6.1.0
            with:
              path: .groma/swift-syntax-build
              key: >-
                swift-syntax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
                  '.github/actions/setup-swift/action.yml',
                  'plugins/scanners/swift/Package.swift') }}
          - uses: ./.github/actions/setup-swift
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: ${{ env.BUN_VERSION }}
          - uses: dart-lang/setup-dart@v1.8.1
            with:
              sdk: '3.13.6'
              # Swift's Windows setup exports its own action path; Dart analysis still runs below.
              problem-matcher: false
          - uses: actions/setup-java@v6.1.0
            with:
              distribution: ${{ matrix.platform == 'win32-arm64' && 'microsoft' || 'temurin' }}
              # Microsoft provides Windows ARM64 only on its current LTS line.
              java-version: ${{ matrix.platform == 'win32-arm64' && '25.0.4.1' || '27' }}
          - uses: actions/setup-go@v7.0.0
            with:
              go-version-file: plugins/scanners/go/worker/go.mod
              cache-dependency-path: plugins/scanners/go/worker/go.sum
          - uses: actions/setup-dotnet@v6.0.0
            with:
              dotnet-version: '10.0.402'
          - name: Install Rust build toolchain
            run: rustup toolchain install 1.99.1 --profile minimal
            shell: bash
      - name: Check native HTTPS trust
        run: node scripts/check-native-tls.cjs
        shell: bash
      - name: Select Rust build toolchain
        run: rustup override set 1.99.1
        shell: bash
      - parallel:
          - name: Install Bun dependencies
            run: bun install --frozen-lockfile --cafile="$SSL_CERT_FILE" --ignore-scripts
            shell: bash
          - name: Restore C# worker dependencies
            run: dotnet restore plugins/scanners/csharp/dotnet/Groma.CSharpScanner.csproj --locked-mode
            shell: bash
      - name: Build runnable scanner packages
        env:
          GROMA_SWIFT_PM_CACHE: ${{ github.workspace }}/.groma/swift-syntax-build
        run: bun scripts/scanner-release.ts stage scanner-packages
        shell: bash
      - parallel:
          - name: Check Swift evidence and installed worker
            run: GROMA_TEST_SWIFT_PACKAGE=scanner-packages/swift bun test test-bun/swift-scanner.test.ts
            shell: bash
          - name: Check fresh checkouts without project tools
            run: GROMA_TEST_PACKAGES=scanner-packages bun test --timeout 60000 test-bun/scanner-fresh-checkout.test.ts
            shell: bash
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scanner-packages-${{ matrix.platform }}
          path: scanner-packages
          if-no-files-found: error

  publish-scanners:
    if: github.event_name == 'release' || inputs.publish_scanners
    name: publish-official-scanners
    needs: [validate, build-scanners]
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
      - parallel:
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: ${{ env.BUN_VERSION }}
          - uses: actions/setup-node@v7.1.0
            with:
              node-version: ${{ env.NODE_VERSION }}
              registry-url: https://registry.npmjs.org
          - uses: actions/download-artifact@v8.0.2
            with:
              pattern: scanner-packages-*
              path: scanner-artifacts
      - parallel:
          - name: Assemble scanner packages
            run: bun scripts/scanner-release.ts assemble scanner-artifacts scanner-packages
          - name: Use current npm for trusted publishing
            run: npm install --global npm@12.2.0
      - name: Publish contract and official scanners
        run: bun scripts/scanner-release.ts publish scanner-packages
        env:
          NPM_CONFIG_PROVENANCE: true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: published-scanner-packages
          path: scanner-packages
          if-no-files-found: error

  build:
    if: github.event_name == 'release'
    name: build-${{ matrix.target }}
    needs: publish-scanners
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            binary: groma
            package: groma.md-linux-x64
            npm_os: linux
            npm_cpu: x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: groma
            package: groma.md-linux-arm64
            npm_os: linux
            npm_cpu: arm64
          - runner: macos-15
            target: bun-darwin-arm64
            binary: groma
            package: groma.md-darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - runner: windows-latest
            target: bun-windows-x64-baseline
            binary: groma.exe
            package: groma.md-windows-x64
            npm_os: win32
            npm_cpu: x64
          - runner: windows-11-arm
            target: bun-windows-arm64
            binary: groma.exe
            package: groma.md-windows-arm64
            npm_os: win32
            npm_cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - parallel:
          - name: Install all Bun target dependencies
            run: bun install --frozen-lockfile --cafile="$SSL_CERT_FILE" --os="*" --cpu="*"
            shell: bash
          - uses: actions/download-artifact@v8.0.2
            with:
              name: published-scanner-packages
              path: published-scanner-packages
      - name: Embed published scanner metadata
        run: bun scripts/scanner-release.ts catalog published-scanner-packages
        shell: bash
      - name: Prepare verified standalone runtime
        run: node scripts/prepare-bun-runtime.cjs "${{ matrix.target }}"
        shell: bash
      - name: Build standalone binary
        env:
          GROMA_BUILD_TARGET: ${{ matrix.target }}
          GROMA_BUILD_OUTFILE: dist/${{ matrix.binary }}
        run: bun scripts/build.ts
        shell: bash
      - name: Make Unix binary executable
        if: matrix.npm_os != 'win32'
        run: chmod +x "dist/${{ matrix.binary }}"
        shell: bash
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: groma-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release-assets:
    name: release-assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: groma-*
          path: release-artifacts
      - name: Assemble release binaries and checksums
        run: |
          mkdir -p release
          for artifact in release-artifacts/groma-*/; do
            target="${artifact#release-artifacts/groma-}"
            target="${target%/}"
            binary="$(find "$artifact" -maxdepth 1 -type f | head -1)"
            if [[ "$binary" == *.exe ]]; then
              name="groma-${target}.exe"
            else
              name="groma-${target}"
            fi
            cp "$binary" "release/$name"
          done
          (cd release && sha256sum groma-* > SHA256SUMS)
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  publish-platform:
    name: publish-${{ matrix.package }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            binary: groma
            package: groma.md-linux-x64
            npm_os: linux
            npm_cpu: x64
          - target: bun-linux-arm64
            binary: groma
            package: groma.md-linux-arm64
            npm_os: linux
            npm_cpu: arm64
          - target: bun-darwin-arm64
            binary: groma
            package: groma.md-darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - target: bun-windows-x64-baseline
            binary: groma.exe
            package: groma.md-windows-x64
            npm_os: win32
            npm_cpu: x64
          - target: bun-windows-arm64
            binary: groma.exe
            package: groma.md-windows-arm64
            npm_os: win32
            npm_cpu: arm64
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
      - parallel:
          - uses: actions/download-artifact@v8.0.2
            with:
              name: groma-${{ matrix.target }}
              path: artifact
          - uses: actions/setup-node@v7.1.0
            with:
              node-version: ${{ env.NODE_VERSION }}
              registry-url: https://registry.npmjs.org
      - parallel:
          - name: Prepare platform package
            env:
              RELEASE_TAG: ${{ github.ref_name }}
            run: |
              version="${RELEASE_TAG#v}"
              mkdir -p package
              cp "artifact/${{ matrix.binary }}" "package/${{ matrix.binary }}"
              cp LICENSE package/
              if [[ "${{ matrix.npm_os }}" != "win32" ]]; then
                chmod +x "package/${{ matrix.binary }}"
              fi
              node - "$version" "${{ matrix.package }}" "${{ matrix.npm_os }}" "${{ matrix.npm_cpu }}" "${{ matrix.binary }}" <<'NODE'
              const fs = require('node:fs')
              const [version, name, os, cpu, binary] = process.argv.slice(2)
              const manifest = {
                name,
                version,
                description: 'Groma standalone architecture CLI',
                license: 'MIT',
                repository: { type: 'git', url: 'https://github.com/MrLesk/groma.md.git' },
                os: [os],
                cpu: [cpu],
                files: [binary, 'package.json', 'LICENSE'],
              }
              fs.writeFileSync('package/package.json', `${JSON.stringify(manifest, null, 2)}\n`)
              NODE
            shell: bash
          - name: Use current npm for trusted publishing
            run: npm install --global npm@12.2.0
      - name: Publish platform package
        working-directory: package
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-wrapper:
    name: publish-groma.md
    needs: publish-platform
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - parallel:
          - name: Prepare npm wrapper package
            env:
              RELEASE_TAG: ${{ github.ref_name }}
            run: |
              version="${RELEASE_TAG#v}"
              mkdir -p package
              cp scripts/npm/cli.cjs package/cli.cjs
              cp README.md LICENSE package/
              node - "$version" <<'NODE'
              const fs = require('node:fs')
              const root = JSON.parse(fs.readFileSync('package.json', 'utf8'))
              const [version] = process.argv.slice(2)
              const platformPackages = [
                'groma.md-linux-x64',
                'groma.md-linux-arm64',
                'groma.md-darwin-arm64',
                'groma.md-windows-x64',
                'groma.md-windows-arm64',
              ]
              const manifest = {
                name: root.name,
                version,
                description: root.description,
                license: root.license,
                author: root.author,
                homepage: root.homepage,
                repository: root.repository,
                bugs: root.bugs,
                keywords: root.keywords,
                engines: root.engines,
                bin: { groma: 'cli.cjs' },
                files: ['cli.cjs', 'package.json', 'README.md', 'LICENSE'],
                optionalDependencies: Object.fromEntries(platformPackages.map(name => [name, version])),
              }
              fs.writeFileSync('package/package.json', `${JSON.stringify(manifest, null, 2)}\n`)
              NODE
            shell: bash
          - name: Use current npm for trusted publishing
            run: npm install --global npm@12.2.0
      - name: Publish groma.md
        working-directory: package
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  sync-version:
    name: sync-version-to-main
    needs: [release-assets, publish-wrapper]
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set released version in main checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - name: Commit released version to main
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: 'chore: sync groma.md version to ${{ github.ref_name }}'
          branch: main
          file_pattern: package.json
