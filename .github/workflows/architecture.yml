name: Groma architecture

on:
  push:
    branches: [main]
  # Runs main's copy of this workflow. Pull request code is only read, never executed.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Reviewed PR number to include (0 compares same-repository PRs only)
        type: number
        default: 0

permissions:
  contents: read
  pages: read

env:
  NODE_OPTIONS: --use-openssl-ca
  GROMA_THEME: auto

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Each deploy replaces the site. Fork comparisons require a reviewed PR number for this run.
  pulls:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      open: ${{ steps.open.outputs.pulls }}
    steps:
      - &prepare-trust
        name: Block compromised certificate authorities before network steps
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), tls = require('node:tls');
          const { X509Certificate, createHash } = require('node:crypto');
          if (Object.keys(process.env).some(key => key.toUpperCase() === 'GIT_SSL_NO_VERIFY' && process.env[key] !== undefined)) {
            throw new Error('Remove GIT_SSL_NO_VERIFY from the runner or workflow environment before continuing.');
          }
          // CVE-2026-111943: protect action network calls; runner archive downloads happen earlier.
          const blocked = new Set([
            '0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282',
            '43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b',
            '49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f',
            '5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0',
            '63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8',
            '8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782',
            '92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30',
            'bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3',
            'c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9',
            'e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41',
            'ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105',
            'ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6',
          ]);
          const certificates = new Map();
          for (const pem of [...tls.rootCertificates, ...tls.getCACertificates('default'), ...tls.getCACertificates('system'), ...tls.getCACertificates('extra')]) {
            const certificate = new X509Certificate(pem);
            const key = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            if (!blocked.has(key)) certificates.set(certificate.fingerprint256, pem);
          }
          if (!certificates.size) throw new Error('No trusted certificate authorities remain.');
          const directory = path.join(process.env.RUNNER_TEMP, 'groma-tls');
          const bundle = path.join(directory, 'ca.pem'), empty = path.join(directory, 'empty');
          fs.mkdirSync(empty, { recursive: true });
          fs.writeFileSync(bundle, [...certificates.values()].join('\n') + '\n');
          const repository = new URL(`${process.env.GITHUB_SERVER_URL.replace(/\/+$/, '')}/${process.env.GITHUB_REPOSITORY}`);
          if (repository.protocol !== 'https:' || repository.username || repository.password) throw new Error('Expected a credential-free HTTPS GitHub server.');
          const git = [['http.schannelUseSSLCAInfo', 'true'], ['http.sslVerify', 'true']];
          for (const url of [repository.href, `${repository.href}.git`]) {
            git.push([`http.${url}.sslVerify`, 'true'], [`http.${url}.schannelUseSSLCAInfo`, 'true']);
          }
          const rawGitSettings = process.env.GIT_CONFIG_COUNT ?? '0';
          const gitSettings = Number(rawGitSettings);
          if (!/^(0|[1-9][0-9]*)$/.test(rawGitSettings) || !Number.isSafeInteger(gitSettings + git.length)) throw new Error('Invalid GIT_CONFIG_COUNT.');
          const settings = {
            SSL_CERT_FILE: bundle, SSL_CERT_DIR: empty,
            NODE_EXTRA_CA_CERTS: bundle, NODE_USE_SYSTEM_CA: '0', NODE_TLS_REJECT_UNAUTHORIZED: '1',
            GIT_SSL_CAINFO: bundle, GIT_SSL_CAPATH: empty, CURL_CA_BUNDLE: bundle,
            CARGO_HTTP_CAINFO: bundle, NPM_CONFIG_CAFILE: bundle,
          };
          for (const [offset, [key, value]] of git.entries()) {
            settings[`GIT_CONFIG_KEY_${gitSettings + offset}`] = key;
            settings[`GIT_CONFIG_VALUE_${gitSettings + offset}`] = value;
          }
          settings.GIT_CONFIG_COUNT = String(gitSettings + git.length);
          const quote = value => "'" + value.replaceAll("'", "'\\''") + "'";
          settings.GIT_CONFIG_PARAMETERS = [process.env.GIT_CONFIG_PARAMETERS,
            ...git.map(([key, value]) => quote(key) + '=' + quote(value))].filter(Boolean).join(' ');
          for (const value of Object.values(settings)) {
            if (/[\r\n]/.test(value)) throw new Error('TLS environment values must not contain newlines.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(settings).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
      - name: List open pull requests
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_PR: ${{ inputs.pull-request || 0 }}
        run: |
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open" \
            | jq --arg repo "$GITHUB_REPOSITORY" --argjson reviewed "$REVIEWED_PR" \
              '[.[] | select(.head.repo.full_name == $repo or .number == $reviewed) |
                {number, head: .head.sha, base: .base.sha}]' | jq -cs 'add // []')
          echo "pulls=$pulls" >> "$GITHUB_OUTPUT"

  compare:
    name: 'Compare PR #${{ matrix.pull.number }}'
    needs: pulls
    if: needs.pulls.outputs.open != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.pulls.outputs.open) }}
    steps:
      - *prepare-trust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.pull.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the merge base
        id: commits
        env:
          BASE: ${{ matrix.pull.base }}
          HEAD: ${{ matrix.pull.head }}
        # Keep the trusted base checked out; export reads the PR commit from Git.
        run: |
          git fetch --no-tags origin "$HEAD"
          echo "from=$(git merge-base "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"

      # The published action requests Node 24; prewarm its latest patched runtime.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - uses: MrLesk/groma.md-action@ea7042367a573e3b07ae00437767df04bcf284f2
        id: map
        with:
          groma-version: '0.7.2'
          output: groma-comparison
          theme: ${{ env.GROMA_THEME }}
          from: ${{ steps.commits.outputs.from }}
          revision: ${{ matrix.pull.head }}

      - name: Place the comparison at /comparison/pr-<n>/
        env:
          NUMBER: ${{ matrix.pull.number }}
          MAP: ${{ steps.map.outputs.directory }}
        run: |
          mkdir -p "preview/comparison/pr-$NUMBER"
          mv "$MAP" "preview/comparison/pr-$NUMBER/$GROMA_THEME"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: groma-comparison-${{ matrix.pull.number }}
          path: preview
          retention-days: 1

  build:
    needs: [pulls, compare]
    # A failed comparison leaves out that pull request; the map still publishes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *prepare-trust
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - parallel:
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: '1.4.3'

          - uses: actions/configure-pages@v6.0.0
            id: pages

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cafile="$SSL_CERT_FILE"
          bun add --global backlog.md@1.55.0 --cafile="$SSL_CERT_FILE"

      - name: Restore released scanner runtimes
        # Export reads saved architecture; source readiness is required only for a new scan.
        run: |
          bun -e '
            const file = Bun.file("groma/config.json");
            const config = await file.json();
            for (const scanner of config.scanners) {
              const { name, version } = await Bun.file(`${scanner.source}/package.json`).json();
              scanner.source = `${name}@${version}`;
            }
            await Bun.write(file, JSON.stringify(config, null, 2) + "\n");
          '
          bun run cli plugin install

      - parallel:
          - name: Export the committed architecture
            env:
              PAGE_URL: ${{ steps.pages.outputs.base_url }}
            run: bun run cli export "./site/architecture/$GROMA_THEME" --url "${PAGE_URL%/}/architecture/$GROMA_THEME/"

          - name: Add the pull request comparisons
            if: needs.compare.result == 'success' || needs.compare.result == 'failure'
            uses: actions/download-artifact@v8.0.2
            with:
              pattern: groma-comparison-*
              merge-multiple: true
              path: ./site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.map-url.outputs.url }}
    steps:
      - *prepare-trust
      - name: Publish architecture website
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Link to the architecture map
        id: map-url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "url=${PAGE_URL%/}/architecture/$GROMA_THEME/" >> "$GITHUB_OUTPUT"

  # One comment per pull request, in the same format as the groma.md Action's own comment.
  comment:
    needs: [compare, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.compare.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - *prepare-trust
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: groma-comparison-*
          merge-multiple: true
          path: previews

      - name: Update each pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          shopt -s nullglob
          marker='<!-- groma-comparison -->'
          for summary in previews/comparison/pr-*/"$GROMA_THEME"/comparison.json; do
            number=${summary#previews/comparison/pr-}
            number=${number%%/*}
            body=$(jq -r --arg marker "$marker" --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --arg url "${PAGE_URL%/}/comparison/pr-$number/$GROMA_THEME/" '
              def row($name; $count): "| \($name) | \($count.added) | \($count.modified) | \($count.removed) |";
              [$marker, "### Groma architecture comparison", "",
                "| Changes | Added | Modified | Removed |", "| --- | ---: | ---: | ---: |",
                row("Components"; .components), row("Relationships"; .relationships), "",
                "[Open before / after comparison](\($url)?revision=\(.revision)&from=\(.from))", "",
                "Compared [\(.from[0:7])](\($repo)/commit/\(.from)) (merge base) → [\(.revision[0:7])](\($repo)/commit/\(.revision))."]
              | join("\n")' "$summary")
            id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
            if [ -z "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
            elif [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body)" != "$body" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
            fi
          done
