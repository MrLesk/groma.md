name: Groma architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

env:
  GROMA_THEME: auto

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun add --global backlog.md@1.53.0

      - name: Restore released scanner runtimes
        run: |
          bun -e '
            const file = Bun.file("groma/scanners.json");
            const config = await file.json();
            for (const scanner of config.scanners) {
              const { name, version } = await Bun.file(`${scanner.source}/package.json`).json();
              scanner.source = `${name}@${version}`;
            }
            await Bun.write(file, JSON.stringify(config, null, 2) + "\n");
          '
          bun run cli scanner install
          bun run cli scanner check

      - name: Export the committed architecture
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: bun run cli export "./site/architecture/$GROMA_THEME" --url "${PAGE_URL%/}/architecture/$GROMA_THEME/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.map-url.outputs.url }}
    steps:
      - name: Publish architecture website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Link to the architecture map
        id: map-url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "url=${PAGE_URL%/}/architecture/$GROMA_THEME/" >> "$GITHUB_OUTPUT"
