name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-profile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Reproduce concurrent profile reads
        shell: bash
        run: |
          cat > profile-diagnostic.ts <<'SCRIPT'
          import { cp, mkdtemp, rm } from 'node:fs/promises'
          import os from 'node:os'
          import path from 'node:path'
          const filename = 'src/project-profile.ts'
          const source = await Bun.file(filename).text()
          await Bun.write(filename, source.replace('} catch {', '} catch (error) { console.error("PROFILE FAILURE", error);'))
          const { loadMapRoot } = await import('./src/viewers/web/runtime.ts')
          const root = await mkdtemp(path.join(os.tmpdir(), 'groma-profile-diagnostic-'))
          try {
            await cp('test/fixtures/source-view', root, { recursive: true })
            for (let i = 0; i < 1000; i++) {
              const maps = await Promise.all([loadMapRoot(root), loadMapRoot(root)])
              if (maps.some(map => map.project === null)) throw new Error(`Profile disappeared at iteration ${i}`)
              if (i % 100 === 0) console.log(`Completed ${i} iterations`)
            }
          } finally { await rm(root, { recursive: true, force: true }) }
          SCRIPT
          bun profile-diagnostic.ts
