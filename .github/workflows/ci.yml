name: Windows timeout diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/scanners/go/worker/go.mod
          cache-dependency-path: plugins/scanners/go/worker/go.sum
      - run: bun install --frozen-lockfile
        shell: bash
      - name: Trace unchanged scenarios with overlapping Go compilation
        env:
          GROMA_TEST_GO: go
        run: |
          for iteration in 1 2 3 4 5; do
            echo "Diagnostic iteration $iteration"
            bun test --parallel=2 --max-concurrency 1 --timeout 20000 test-bun/web-revisions.test.ts test-bun/kotlin-scanner.test.ts test-bun/go-scanner.test.ts
          done
        shell: bash
