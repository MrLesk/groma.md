name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  BUN_VERSION: 1.4.3
  RUST_VERSION: 1.99.1

jobs:
  check:
    name: check-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - &prepare-trust
        name: Block compromised certificate authorities before network steps
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), tls = require('node:tls');
          const { X509Certificate, createHash } = require('node:crypto');
          if (Object.keys(process.env).some(key => key.toUpperCase() === 'GIT_SSL_NO_VERIFY' && process.env[key] !== undefined)) {
            throw new Error('Remove GIT_SSL_NO_VERIFY from the runner or workflow environment before continuing.');
          }
          // CVE-2026-111943: protect action network calls; runner archive downloads happen earlier.
          const blocked = new Set([
            '0a6c2b2ca5b364207954171987ac9d2178561569d8205457e77ca90c32ede282',
            '43bffa19d6ef651451f6841e019931e96f6f2eaeff28ab4b6f1ce4576de2717b',
            '49dd353dc2b919a3770645117d0e60c16115e7d1bc259eefe734b00ea434fe5f',
            '5c0660a2b164910d8ff589c18e14552e9e0ec237dcefe2cb736d41a4811f81a0',
            '63ecefee431d49523bc1136c4e72d0206a477086caf606cd5cf025686c109cf8',
            '8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782',
            '92c063d67e8f14db71d288e11266ffdaf69cbf115f7bab14f3bc2f68d25e0e30',
            'bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3',
            'c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9',
            'e0254c7fcdc265e2f0f8a428dabb75ab4ae039b4872d62f5ee57f0877d5a8a41',
            'ebed6475c2c2d80fcb199f3fe8dd6e6b3ce60b77eb15d4e42c3dec0c6f5b5105',
            'ec4ffa1ad0ac88081314b7aaffef6a91f97cd57291bb5ba686c5415f5eb4f6b6',
          ]);
          const certificates = new Map();
          for (const pem of [...tls.rootCertificates, ...tls.getCACertificates('default'), ...tls.getCACertificates('system'), ...tls.getCACertificates('extra')]) {
            const certificate = new X509Certificate(pem);
            const key = createHash('sha256').update(certificate.publicKey.export({ type: 'spki', format: 'der' })).digest('hex');
            if (!blocked.has(key)) certificates.set(certificate.fingerprint256, pem);
          }
          if (!certificates.size) throw new Error('No trusted certificate authorities remain.');
          const directory = path.join(process.env.RUNNER_TEMP, 'groma-tls');
          const bundle = path.join(directory, 'ca.pem'), empty = path.join(directory, 'empty');
          const proxy = path.join(directory, 'https-proxy-disabled');
          fs.mkdirSync(empty, { recursive: true });
          fs.writeFileSync(bundle, [...certificates.values()].join('\n') + '\n');
          const repository = new URL(`${process.env.GITHUB_SERVER_URL.replace(/\/+$/, '')}/${process.env.GITHUB_REPOSITORY}`);
          if (repository.protocol !== 'https:' || repository.username || repository.password) throw new Error('Expected a credential-free HTTPS GitHub server.');
          const git = [['http.schannelUseSSLCAInfo', 'true'], ['http.sslVerify', 'true']];
          for (const url of [repository.href, `${repository.href}.git`]) {
            git.push([`http.${url}.sslVerify`, 'true'], [`http.${url}.schannelUseSSLCAInfo`, 'true']);
          }
          // Git cannot isolate proxy CApath. An impossible child of a regular file fails before authentication.
          fs.writeFileSync(proxy, '', { mode: 0o600 });
          const rawGitSettings = process.env.GIT_CONFIG_COUNT ?? '0';
          const gitSettings = Number(rawGitSettings);
          if (!/^(0|[1-9][0-9]*)$/.test(rawGitSettings) || !Number.isSafeInteger(gitSettings + git.length)) throw new Error('Invalid GIT_CONFIG_COUNT.');
          const settings = {
            SSL_CERT_FILE: bundle, SSL_CERT_DIR: empty,
            NODE_EXTRA_CA_CERTS: bundle, NODE_USE_SYSTEM_CA: '0', NODE_TLS_REJECT_UNAUTHORIZED: '1',
            GIT_SSL_CAINFO: bundle, GIT_SSL_CAPATH: empty, CURL_CA_BUNDLE: bundle,
            GIT_PROXY_SSL_CAINFO: path.join(proxy, 'unavailable.pem'),
            CARGO_HTTP_CAINFO: bundle, NPM_CONFIG_CAFILE: bundle,
          };
          for (const [offset, [key, value]] of git.entries()) {
            settings[`GIT_CONFIG_KEY_${gitSettings + offset}`] = key;
            settings[`GIT_CONFIG_VALUE_${gitSettings + offset}`] = value;
          }
          settings.GIT_CONFIG_COUNT = String(gitSettings + git.length);
          for (const key of Object.keys(process.env)) {
            if (key.toUpperCase() === 'GIT_PROXY_SSL_CAINFO') settings[key] = settings.GIT_PROXY_SSL_CAINFO;
          }
          const quote = value => "'" + value.replaceAll("'", "'\\''") + "'";
          settings.GIT_CONFIG_PARAMETERS = [process.env.GIT_CONFIG_PARAMETERS,
            ...git.map(([key, value]) => quote(key) + '=' + quote(value))].filter(Boolean).join(' ');
          for (const value of Object.values(settings)) {
            if (/[\r\n]/.test(value)) throw new Error('TLS environment values must not contain newlines.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(settings).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - name: Prepare native HTTPS trust on disposable hosted runners
        run: node scripts/prepare-hosted-runner-trust.cjs
        shell: bash
      - parallel:
          - name: Cache Swift test package
            id: swift-package
            uses: actions/cache@v6.1.0
            with:
              path: scanner-packages/swift
              key: >-
                swift-test-package-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles(
                  '.github/actions/setup-swift/action.yml',
                  'plugins/scanners/swift/**',
                  'packages/scanner/**',
                  'docs/scanners/swift/**',
                  'LICENSE') }}
          - name: Cache C# test package
            id: csharp-package
            uses: actions/cache@v6.1.0
            with:
              path: scanner-packages/csharp
              key: >-
                csharp-test-package-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles(
                  'plugins/scanners/csharp/**',
                  'plugins/scanners/projects.ts',
                  'packages/scanner/**',
                  'scripts/package-csharp-scanner.ts',
                  'bun.lock', 'LICENSE') }}
          - name: Cache Rust test package
            id: rust-package
            uses: actions/cache@v6.1.0
            with:
              path: plugins/scanners/rust/dist
              key: >-
                rust-test-package-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles(
                  'plugins/scanners/rust/**',
                  'plugins/scanners/projects.ts',
                  'plugins/scanners/observations.ts',
                  'packages/scanner/**',
                  'bun.lock', 'LICENSE') }}
      - name: Prepare patched Rustup
        if: steps.rust-package.outputs.cache-hit != 'true'
        run: node --use-env-proxy scripts/prepare-rustup.cjs
        shell: bash
      - parallel:
          - name: Cache SwiftSyntax build
            if: runner.os == 'Windows' && steps.swift-package.outputs.cache-hit != 'true'
            uses: actions/cache@v6.1.0
            with:
              path: .groma/swift-syntax-build
              key: >-
                swift-syntax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
                  '.github/actions/setup-swift/action.yml',
                  'plugins/scanners/swift/Package.swift') }}
          - uses: ./.github/actions/setup-swift
            if: steps.swift-package.outputs.cache-hit != 'true'
          - uses: dart-lang/setup-dart@v1.8.1
            with:
              sdk: '3.13.6'
              # Swift's Windows setup exports its own action path; Dart analysis still runs below.
              problem-matcher: false
          - uses: actions/setup-java@v6.1.0
            with:
              distribution: temurin
              java-version: '27'
          - uses: actions/setup-go@v7.0.0
            with:
              go-version-file: plugins/scanners/go/worker/go.mod
              cache-dependency-path: plugins/scanners/go/worker/go.sum
          - uses: actions/setup-dotnet@v6.0.0
            with:
              dotnet-version: '10.0.402'
          - name: Install Rust build toolchain
            if: steps.rust-package.outputs.cache-hit != 'true'
            run: |
              [[ "$(rustup --version)" == "rustup 1.29.2 "* ]]
              rustup toolchain install "$RUST_VERSION" --profile minimal
            shell: bash
          - uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version: ${{ env.BUN_VERSION }}
      - name: Check native HTTPS trust
        run: node scripts/check-native-tls.cjs
        shell: bash
      - name: Install dependencies
        run: bun install --frozen-lockfile --cafile="$SSL_CERT_FILE"
        shell: bash
      - parallel:
          - name: Build Swift test package
            if: steps.swift-package.outputs.cache-hit != 'true'
            env:
              GROMA_SWIFT_PM_CACHE: ${{ github.workspace }}/.groma/swift-syntax-build
            run: bun plugins/scanners/swift/build.ts scanner-packages/swift
            shell: bash
          - name: Build C# test package
            if: steps.csharp-package.outputs.cache-hit != 'true'
            run: |
              dotnet restore plugins/scanners/csharp/dotnet/Groma.CSharpScanner.csproj --locked-mode
              bun scripts/package-csharp-scanner.ts scanner-packages/csharp
            shell: bash
          - name: Build Rust test package
            if: steps.rust-package.outputs.cache-hit != 'true'
            run: RUSTUP_TOOLCHAIN="$RUST_VERSION" bun plugins/scanners/rust/build.ts
            shell: bash
      - name: Build COBOL test package
        run: bun plugins/scanners/cobol/build.ts scanner-packages/cobol
        shell: bash
      - name: Build Scala test package
        run: bun plugins/scanners/scala/build.ts
        shell: bash
      - name: Build Java test package
        run: bun plugins/scanners/java/build.ts
        shell: bash
      - name: Build Kotlin test package
        run: bun plugins/scanners/kotlin/build.ts
        shell: bash
      - name: Build scanner packages for fresh-checkout checks
        run: |
          bun plugins/scanners/c/build.ts scanner-packages/c
          bun plugins/scanners/cpp/build.ts scanner-packages/cpp
          bun plugins/scanners/ada/build.ts scanner-packages/ada
          bun plugins/scanners/dart/build.ts scanner-packages/dart
          bun plugins/scanners/mql5/build.ts scanner-packages/mql5
          bun plugins/scanners/mojo/build.ts scanner-packages/mojo
          bun plugins/scanners/typescript/build.ts scanner-packages/typescript
        shell: bash
      - name: Check scanner packages without language tools
        env:
          GROMA_TEST_PACKAGES: scanner-packages
        run: bun test --timeout 60000 test-bun/scanner-fresh-checkout.test.ts --test-name-pattern '^(c|cpp|ada|dart|mql5|mojo|typescript) package'
        shell: bash
      - parallel:
          - name: Run repository checks
            env:
              GROMA_TEST_SWIFT_PACKAGE: scanner-packages/swift
              GROMA_TEST_COBOL_PACKAGE: scanner-packages/cobol
              GROMA_TEST_SCALA_PACKAGE: plugins/scanners/scala/dist/package
              GROMA_TEST_KOTLIN_PACKAGE: plugins/scanners/kotlin/dist/package
              GROMA_TEST_JAVA_PACKAGE: plugins/scanners/java/dist/package
              GROMA_TEST_CSHARP_PACKAGE: ${{ github.workspace }}/scanner-packages/csharp
              GROMA_TEST_GO: go
              GROMA_TEST_DART_PACKAGE: scanner-packages/dart
            # The Rust build names the worker's folder after Bun's platform and architecture.
            run: |
              platform=$(bun -e 'process.stdout.write(`${process.platform}-${process.arch}`)')
              export GROMA_TEST_RUST="$GITHUB_WORKSPACE/plugins/scanners/rust/dist/bin/$platform/groma-rust-scanner$([ "$RUNNER_OS" = Windows ] && echo .exe)"
              bun run check
            shell: bash
          - name: Run C# worker tests
            run: bun run test:csharp
            shell: bash
          - name: Build and check standalone npm command
            run: |
              bun run build
              binary=dist/groma
              if [[ "$RUNNER_OS" == Windows ]]; then binary=dist/groma.exe; fi
              GROMA_TEST_CLI="$binary" bun test --timeout 60000 test-bun/npm-packaging.test.ts --test-name-pattern '^packaged Groma'
            shell: bash
